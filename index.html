<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3347E0" />
    <meta name="description" content="Monthly budget tracker. Log spending in seconds. Data stays on your device." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Budget Tracker</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var d = JSON.parse(localStorage.getItem('budget-tracker:v1') || '{}');
        var t = (d.settings && d.settings.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
